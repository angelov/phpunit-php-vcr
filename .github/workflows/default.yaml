name: Default
on:
  push:
    branches:
      - main
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.3', '8.4', '8.5']
        phpunit: ['^10.5', '^11.0', '^12.0']
        dependency-version: ['lowest', 'highest']
        exclude:
          # PHPUnit 10 supports up to PHP 8.3
          - php: '8.4'
            phpunit: '^10.5'
          - php: '8.5'
            phpunit: '^10.5'

          # PHPUnit 11 supports up to PHP 8.4
          - php: '8.5'
            phpunit: '^11.0'

          # PHPUnit 12 requires PHP >= 8.3
          - php: '8.2'
            phpunit: '^12.0'

    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          tools: composer

      - name: Cache Composer packages
        uses: actions/cache@v3
        with:
          path: vendor
          key: ${{ runner.os }}-php-${{ matrix.php }}-${{ matrix.phpunit }}-${{ matrix.dependency-version }}-${{ hashFiles('**/composer.lock') }}

      - name: Install dependencies
        run: |
          composer require --dev phpunit/phpunit:"${{ matrix.phpunit }}" --no-update
          if [ "${{ matrix.dependency-version }}" = "lowest" ]; then
            composer update --prefer-lowest --prefer-dist --no-progress -W
          else
            composer update --prefer-dist --no-progress -W
          fi

      - name: Check coding standard
        run: vendor/bin/phpcs -p

      - name: Analyze with PHPStan
        run: vendor/bin/phpstan analyse

      - name: Execute PHPUnit tests
        run: vendor/bin/phpunit
